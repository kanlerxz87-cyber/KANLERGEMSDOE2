name: Diagnose public leaderboard feed
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
permissions:
  contents: read
jobs:
  inspect-public-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Report table structure without participant names
        run: |
          python - <<'PY'
          import re, sys
          from urllib.request import Request, urlopen
          sys.path.insert(0, 'scripts')
          from refresh_public_feed import Tables, PARTIAL_URL as URL
          request = Request(URL, headers={'User-Agent': 'GEMS-evidence-feed/1.0'})
          with urlopen(request, timeout=25) as response:
              if response.geturl() != URL:
                  raise RuntimeError('Unexpected redirect')
              text = response.read(5_000_001).decode('utf-8')
          if len(text) > 5_000_000:
              raise RuntimeError('Unexpectedly large response')
          parser = Tables()
          parser.feed(text)
          print(f'::notice file=scripts/refresh_public_feed.py,title=Public leaderboard table count::tables={len(parser.tables)}')
          if not parser.tables:
              title = re.search(r'<title[^>]*>(.*?)</title>', text, re.I | re.S)
              title = ' '.join(title.group(1).split())[:100] if title else '<missing>'
              sources = re.findall(r'<script[^>]+src=[\"\']([^\"\']+)', text, re.I)
              routes = re.findall(r'[\"\'](/[^\"\'<> ]{0,120}leaderboard[^\"\'<> ]{0,120})[\"\']', text, re.I)
              print(f'::notice file=scripts/refresh_public_feed.py,title=Public page structure::title={title!r}; bytes={len(text)}; scripts={sources[:12]!r}; routes={routes[:12]!r}')
          for i, table in enumerate(parser.tables):
              if not table:
                  continue
              joined = ' | '.join(table[0])[:600]
              header = joined.replace('%', '%25') if 'rank' in joined.lower() and 'tversky' in joined.lower() else '<unrecognized header>'
              tags = re.findall(r'</?(?:table|thead|tbody|tr|th)\b[^>]*>', text, re.I)[:20]
              print(f'::notice file=scripts/refresh_public_feed.py,title=Public table {i} header::rows={len(table)} header={header}; tags={tags!r}')
              for row in table[:3]:
                  if not row:
                      continue
                  # Inspect the first cell and standalone numeric cells only;
                  # participant names and profile URLs never enter annotations.
                  rank = row[0] if re.fullmatch(r'[#0-9.,\s]+', row[0]) else f'<non-numeric, length={len(row[0])}>'
                  nums = [c for c in row[1:] if re.fullmatch(r'[#0-9.,\s]+', c)]
                  print(f'::notice file=scripts/refresh_public_feed.py,title=Public table {i} row::rank_cell={rank!r}; cells={len(row)}; numeric_cells={nums!r}')
          PY
      - name: Verify the fixed public partial and parser
        run: |
          python scripts/refresh_public_feed.py --out "$RUNNER_TEMP/leaderboard-diagnostic.json" || true
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'leaderboard-diagnostic.json').read_text())
          print(f"::notice file=scripts/refresh_public_feed.py,title=Public feed parser result::status={data['status']}; observed={data.get('observed_utc', data.get('attempted_utc'))}; rank1={data['top_public_dti']}; rank5={data['fifth_public_dti']}; error={data.get('error')}")
          if data['status'] != 'success':
              sys.exit(1)
          PY
