name: Deploy DOE GEMS Submission Portal to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '25 */6 * * *'
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -v
      - run: python scripts/evaluate_holdout.py --verify-kg2
      - name: Rebuild the fail-closed evidence pages
        run: python scripts/build_site.py
      - name: Stage research downloads and evidence
        run: |
          mkdir -p _site/docs _site/evidence _site/registry _site/research
          cp index.html .nojekyll _site/
          cp -R docs/. _site/docs/
          cp -R evidence/. _site/evidence/
          cp -R registry/. _site/registry/
          cp -R research/. _site/research/
      - name: Refresh dated public leaderboard snapshot (fail closed if unavailable)
        run: python scripts/refresh_public_feed.py --out _site/docs/data/public_leaderboard.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify-and-stage
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
