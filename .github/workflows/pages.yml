name: Test and deploy Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q scripts src
      - run: python scripts/run_tests.py
      - run: python -m pytest -q
      - run: node tests/test_feed.js
      - run: python scripts/build_site.py
      - run: python scripts/build_k2_site.py --check
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the public dashboard and evidence
        run: |
          mkdir -p _site/docs _site/evidence
          cp index.html .nojekyll _site/
          cp -R docs/. _site/docs/
          cp -R evidence/. _site/evidence/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
