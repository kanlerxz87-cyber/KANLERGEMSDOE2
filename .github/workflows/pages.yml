name: Test and publish audited site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run synthetic and bundled-artifact tests
        run: python -m pytest -q
      - name: Refresh public leaderboard snapshot if reachable
        if: github.event_name != 'pull_request'
        run: python scripts/refresh_leaderboard.py || echo 'Public page unavailable or changed; retaining the dated snapshot.'
      - name: Build fail-closed site
        run: python scripts/build_site.py
      - name: Stage static Pages artifact
        run: |
          mkdir -p _site
          cp -R docs/. _site/
          cp _site/index.html _site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
