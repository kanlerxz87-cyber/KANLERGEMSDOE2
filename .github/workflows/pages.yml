name: Publish research review and refresh leaderboard
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - run: python scripts/build_site.py
      - name: Fetch public leaderboard or publish unavailable status
        run: python scripts/refresh_leaderboard.py
      - name: Stage static research portal
        run: |
          mkdir -p _site/docs _site/evidence _site/knowledge
          cp index.html .nojekyll EXECUTIVE_SUMMARY.md _site/
          cp -R docs/. _site/docs/
          cp -R evidence/. _site/evidence/
          cp -R knowledge/. _site/knowledge/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: stage
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
