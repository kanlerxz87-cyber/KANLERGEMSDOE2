name: Evidence and format checks
on:
  push:
    branches: [main, arena/232ecd8d-kanlergemsdoe2]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_site.py
      - run: git diff --exit-code -- docs research/run_card.json
