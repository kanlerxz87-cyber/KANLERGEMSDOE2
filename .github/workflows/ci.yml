name: Evidence and format checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m compileall -q scripts src
      - run: python -m pytest -q
      - run: python scripts/run_tests.py
      - run: node --test tests/test_leaderboard_script.cjs
      - run: bash -n scripts/bootstrap_template.sh scripts/download_competition_data.sh
      - run: python scripts/build_site.py
      - run: git diff --exit-code -- docs research/run_card.json evidence/run_card.json
