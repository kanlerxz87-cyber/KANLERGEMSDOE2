[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kanlergemsdoe2"
version = "1.0.0"
description = "KANLERGEMSDOE2 — Hydrothermal-Tectonic Conduit & Anisotropic Dilational Step-Over Synthesis (HTCADS) for DOE GEMS Prize"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "rasterio>=1.3",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "shapely>=2.0",
    "pyproj>=3.6",
    "scikit-image>=0.22",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
